<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多米诺骨牌学习游戏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <h1>多米诺骨牌学习游戏</h1>
            <div class="controls">
                <button id="resetBtn" class="btn btn-reset">重置</button>
                <button id="pushBtn" class="btn btn-push">推倒!</button>
            </div>
        </header>

        <div class="game-content">
            <aside class="sidebar">
                <div class="panel">
                    <h3>字母骨牌</h3>
                    <div class="domino-grid" id="letterGrid">
                        <!-- 字母骨牌由JS生成 -->
                    </div>
                </div>

                <div class="panel">
                    <h3>数字骨牌</h3>
                    <div class="domino-grid" id="numberGrid">
                        <!-- 数字骨牌由JS生成 -->
                    </div>
                </div>

                <div class="panel">
                    <h3>动物骨牌</h3>
                    <div class="domino-grid" id="animalGrid">
                        <!-- 动物骨牌由JS生成 -->
                    </div>
                </div>

                <div class="panel">
                    <h3>知名建筑</h3>
                    <div class="building-grid" id="buildingGrid">
                        <!-- 建筑由JS生成 -->
                    </div>
                </div>
            </aside>

            <main class="canvas-container">
                <canvas id="gameCanvas"></canvas>
                <div class="celebration" id="celebration" hidden>
                    <div class="celebration-content">
                        <h2>太棒了!</h2>
                        <div class="stars">★ ★ ★</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/domino.js"></script>
    <script src="js/building.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
